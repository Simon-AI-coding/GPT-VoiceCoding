# GPT-VoiceCoding first-launch configuration.
# The shell creates this only when config.toml is absent, then edits it in place.
# The engine only reads it. See docs/control-plane.md for every supported key.

[engine]
# The socket and state paths use the documented per-user defaults.

[adapters]
call = "gpt_voicecoding.adapters.call.realtime:realtime_call"
companion_channel = "gpt_voicecoding.adapters.companion_channel:null_channel"

[adapters.agents]
claude = "gpt_voicecoding.adapters.agent.claude:claude_agent"
codex = "gpt_voicecoding.adapters.agent.codex:codex_agent"

[adapters.settings.call]
# Voice, realtime model and timing use the engine's defaults until changed.
# Codex is resolved from the login PATH on each spawn, never stored here.

[policy]
# Silence and the two waits use the engine's defaults until changed.

[log]
# Each generation is bounded; retained generations occupy at most 32 MiB total.
max_bytes = 8388608
retained_files = 3
stripped_environment_prefixes = ["Malloc"]

[delegate]
model = "gpt-5.6-terra"
effort = "low"
# The shell inserts cli here from the running bundle's actual location.
