<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img">
  <title>GPT-VoiceCoding architecture</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill: #ffffff; }
    .text { fill: #1f2328; }
    .dim { fill: #656d76; }
    .accent { fill: #c26a00; }
    .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .core { fill: #f6f8fa; stroke: #c26a00; stroke-width: 1.5; }
    .group { fill: none; stroke: #afb8c1; stroke-width: 1; stroke-dasharray: 4 4; }
    .line { fill: none; stroke: #c4cad1; stroke-width: 1.5; }
    .flow { fill: none; stroke: #c26a00; stroke-width: 1.5; stroke-linecap: round;
             stroke-dasharray: 2 14; animation: flow linear infinite; }
    .flow.back { animation-name: flow-back; }
    .lifeline { stroke: #c4cad1; stroke-width: 1; stroke-dasharray: 3 5; }
    @keyframes flow { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }
    @keyframes flow-back { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 16; } }
    .pulse { fill: none; stroke: #c26a00; stroke-width: 3; stroke-linecap: round; }
    .label-bg { fill: #ffffff; }
    
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
